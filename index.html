<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>云智工业互联平台 - 原型页面导航</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .nav-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            transition: all 0.3s ease;
        }
        .nav-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }
        .page-link {
            transition: all 0.2s;
        }
        .page-link:hover {
            background: #e6f7ff;
            border-color: #1890ff;
            color: #1890ff;
        }
    </style>
</head>
<body class="flex items-center justify-center p-6">
    <div class="w-full max-w-4xl">
        <!-- 标题区 -->
        <div class="text-center mb-10">
            <div class="inline-flex items-center gap-3 text-white text-3xl font-bold mb-3">
                <i class="fas fa-cloud"></i>
                <span>云智工业互联平台</span>
            </div>
            <p class="text-white/80 text-lg">原型页面导航中心</p>
        </div>

        <!-- 页面卡片 -->
        <div class="nav-card p-8">
            <h2 class="text-xl font-bold text-gray-800 mb-6 flex items-center gap-2">
                <i class="fas fa-th-large text-blue-600"></i>
                全部页面
            </h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <a href="./人员画像.html" class="page-link block p-4 border border-gray-200 rounded-xl bg-white">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-lg bg-blue-100 text-blue-600 flex items-center justify-center">
                            <i class="fas fa-user-tie"></i>
                        </div>
                        <div>
                            <div class="font-semibold text-gray-800">人员画像</div>
                            <div class="text-xs text-gray-500">员工能力评分展示</div>
                        </div>
                    </div>
                </a>

                <a href="./人才管理.html" class="page-link block p-4 border border-gray-200 rounded-xl bg-white">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-lg bg-indigo-100 text-indigo-600 flex items-center justify-center">
                            <i class="fas fa-users"></i>
                        </div>
                        <div>
                            <div class="font-semibold text-gray-800">人才管理</div>
                            <div class="text-xs text-gray-500">人员信息列表管理</div>
                        </div>
                    </div>
                </a>

                <a href="./人才评分规则.html" class="page-link block p-4 border border-gray-200 rounded-xl bg-white">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-lg bg-cyan-100 text-cyan-600 flex items-center justify-center">
                            <i class="fas fa-chart-line"></i>
                        </div>
                        <div>
                            <div class="font-semibold text-gray-800">人才评分规则</div>
                            <div class="text-xs text-gray-500">评分维度与权重配置</div>
                        </div>
                    </div>
                </a>

                <a href="./项目空间.html" class="page-link block p-4 border border-gray-200 rounded-xl bg-white">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-lg bg-purple-100 text-purple-600 flex items-center justify-center">
                            <i class="fas fa-folder-open"></i>
                        </div>
                        <div>
                            <div class="font-semibold text-gray-800">项目空间</div>
                            <div class="text-xs text-gray-500">项目详情与进度管理</div>
                        </div>
                    </div>
                </a>

                <a href="./项目列表.html" class="page-link block p-4 border border-gray-200 rounded-xl bg-white">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-lg bg-violet-100 text-violet-600 flex items-center justify-center">
                            <i class="fas fa-list-ul"></i>
                        </div>
                        <div>
                            <div class="font-semibold text-gray-800">项目列表</div>
                            <div class="text-xs text-gray-500">全部项目概览</div>
                        </div>
                    </div>
                </a>

                <a href="./任务管理.html" class="page-link block p-4 border border-gray-200 rounded-xl bg-white">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-lg bg-orange-100 text-orange-600 flex items-center justify-center">
                            <i class="fas fa-tasks"></i>
                        </div>
                        <div>
                            <div class="font-semibold text-gray-800">任务管理</div>
                            <div class="text-xs text-gray-500">任务分配与跟踪</div>
                        </div>
                    </div>
                </a>

                <a href="./工单管理.html" class="page-link block p-4 border border-gray-200 rounded-xl bg-white">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-lg bg-red-100 text-red-600 flex items-center justify-center">
                            <i class="fas fa-clipboard-list"></i>
                        </div>
                        <div>
                            <div class="font-semibold text-gray-800">工单管理</div>
                            <div class="text-xs text-gray-500">工单列表与状态</div>
                        </div>
                    </div>
                </a>

                <a href="./工单详情.html" class="page-link block p-4 border border-gray-200 rounded-xl bg-white">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-lg bg-rose-100 text-rose-600 flex items-center justify-center">
                            <i class="fas fa-file-alt"></i>
                        </div>
                        <div>
                            <div class="font-semibold text-gray-800">工单详情</div>
                            <div class="text-xs text-gray-500">单个工单详细信息</div>
                        </div>
                    </div>
                </a>

                <a href="./证书管理.html" class="page-link block p-4 border border-gray-200 rounded-xl bg-white">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-lg bg-green-100 text-green-600 flex items-center justify-center">
                            <i class="fas fa-certificate"></i>
                        </div>
                        <div>
                            <div class="font-semibold text-gray-800">证书管理</div>
                            <div class="text-xs text-gray-500">员工证书资质管理</div>
                        </div>
                    </div>
                </a>

                <a href="./培训记录.html" class="page-link block p-4 border border-gray-200 rounded-xl bg-white">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-lg bg-teal-100 text-teal-600 flex items-center justify-center">
                            <i class="fas fa-chalkboard-teacher"></i>
                        </div>
                        <div>
                            <div class="font-semibold text-gray-800">培训记录</div>
                            <div class="text-xs text-gray-500">培训完成情况统计</div>
                        </div>
                    </div>
                </a>

                <a href="./业务流程图.html" class="page-link block p-4 border border-gray-200 rounded-xl bg-white">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-lg bg-gray-100 text-gray-600 flex items-center justify-center">
                            <i class="fas fa-project-diagram"></i>
                        </div>
                        <div>
                            <div class="font-semibold text-gray-800">业务流程图</div>
                            <div class="text-xs text-gray-500">系统业务流程展示</div>
                        </div>
                    </div>
                </a>
            </div>

            <div class="mt-8 pt-6 border-t border-gray-200 text-center text-sm text-gray-500">
                <p>访问地址：<a href="https://night-k.github.io/project-demo/" class="text-blue-600 hover:underline" target="_blank">https://night-k.github.io/project-demo/</a></p>
                <p class="mt-1">仓库地址：<a href="https://github.com/night-k/project-demo" class="text-blue-600 hover:underline" target="_blank">https://github.com/night-k/project-demo</a></p>
            </div>
        </div>
    </div>
</body>
</html>
